<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live votes</title>
  <link rel="stylesheet" href="overlay.css?v=borderless-glow-2">
  <script src="overlay.js" defer></script>
</head>
<body>
  <main aria-label="Live vote results">
    <div class="scores">
      <section class="team team-left">
        <h2>TEAM <span id="label-0">supernOva</span></h2>
        <div class="score-number"><strong id="percentage-0">—</strong><span>%</span></div>
        <span id="count-0" class="sr-only">— votes</span>
      </section>
      <span class="versus" aria-hidden="true">VS</span>
      <section class="team team-right">
        <h2>TEAM <span id="label-1">grumblebee</span></h2>
        <div class="score-number"><strong id="percentage-1">—</strong><span>%</span></div>
        <span id="count-1" class="sr-only">— votes</span>
      </section>
    </div>
    <div class="split-track" id="split-track" data-empty="true">
      <div id="bar-0" class="segment segment-left" role="progressbar" aria-labelledby="label-0" aria-valuemin="0" aria-valuemax="100"><div style="width:0%"></div></div>
      <div id="bar-1" class="segment segment-right" role="progressbar" aria-labelledby="label-1" aria-valuemin="0" aria-valuemax="100"><div style="width:0%"></div></div>
      <div class="bar-labels" aria-hidden="true"><span id="bar-label-0">supernOva</span><span id="bar-label-1">grumblebee</span></div>
      <div class="divider-track" aria-hidden="true"><span class="divider" id="divider" style="left:50%"></span></div>
    </div>
    <p id="status" role="status">Connecting…</p>
  </main>
</body>
</html>
