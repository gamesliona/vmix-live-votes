<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live votes</title>
  <link rel="stylesheet" href="7.css">
  <link rel="stylesheet" href="overlay.css">
  <script src="overlay.js" defer></script>
</head>
<body>
  <main aria-label="Live vote results">
    <section class="team">
      <div class="caption"><span id="label-0" hidden>supernOva</span><span class="numbers"><span id="count-0">— votes</span><strong id="percentage-0">—</strong></span></div>
      <div class="track"><div id="bar-0" class="animate" role="progressbar" aria-labelledby="label-0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100"><div style="width:0%"></div></div></div>
    </section>
    <section class="team">
      <div class="caption"><span id="label-1" hidden>grumblebee</span><span class="numbers"><span id="count-1">— votes</span><strong id="percentage-1">—</strong></span></div>
      <div class="track"><div id="bar-1" class="animate" role="progressbar" aria-labelledby="label-1" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100"><div style="width:0%"></div></div></div>
    </section>
    <p id="status" role="status">Connecting…</p>
  </main>
</body>
</html>
