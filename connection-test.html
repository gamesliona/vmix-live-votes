<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Sheets browser connection test</title>
<body><h1>Direct browser connection test</h1>
<p>This test sends your key only to the Google Sheets API. It does not save the key.</p>
<label>API key <input id="key" type="password" autocomplete="off"></label>
<label>Tally spreadsheet ID <input id="spreadsheet" autocomplete="off"></label>
<button id="test">Test Sheet1!A1:C3</button><pre id="result">Ready</pre>
<script>
document.getElementById('test').onclick = async () => {
  const key = document.getElementById('key').value;
  const spreadsheetId = document.getElementById('spreadsheet').value.trim();
  document.getElementById('key').value = '';
  const output = document.getElementById('result');
  output.textContent = 'Testing…';
  try {
    if (!spreadsheetId) throw new Error('Enter the tally spreadsheet ID.');
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(spreadsheetId)}/values/Sheet1%21A1%3AC3?valueRenderOption=UNFORMATTED_VALUE`, { headers: { 'X-Goog-Api-Key': key }, signal: AbortSignal.timeout(10000) });
    output.textContent = `HTTP ${response.status}\n${await response.text()}`;
  } catch (error) { output.textContent = `Browser request failed: ${error.message}`; }
};
</script></body></html>
